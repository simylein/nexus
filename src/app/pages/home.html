		const lossSkeletons = [10, 12, 7, 65, 14, 4, 15, 11, 57, 8, 11, 17, 6, 12, 71, 9, 13, 4, 10, 61, 11, 7, 14, 6, 15];
		const packets = {
			count: document.getElementById('packet-count'),
			scale: document.getElementById('packet-scale'),
			times: document.getElementById('packet-times'),
			graph: document.getElementById('packet-graph'),
		};
		const corruptions = {
			count: document.getElementById('corruption-count'),
			scale: document.getElementById('corruption-scale'),
			times: document.getElementById('corruption-times'),
			graph: document.getElementById('corruption-graph'),
		};
		const losses = {
			count: document.getElementById('loss-count'),
			scale: document.getElementById('loss-scale'),
			times: document.getElementById('loss-times'),
			graph: document.getElementById('loss-graph'),
		};
		const units = (amount) => {
			switch (true) {
				case amount >= 1e4:
					return `${(amount / 1e3).toFixed(1)}k`;
				case amount >= 1e3:
					return `${(amount / 1e3).toFixed(2)}k`;
				case amount >= 1e1:
					return amount.toFixed(0);
				default:
					return amount % 1 === 0 ? amount : amount.toFixed(1);
			}
		};
		const loadingPackets = (element) => {
			loading(element.count, ['w-40'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				loading(element.scale.children[ind], ['h-3'], [], '');
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				loading(element.scale.children[element.scale.children.length - 1 - ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				loading(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				loading(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0].children[0]);
				element.graph.children[index].children[0].children[0].classList.add('background-neutral-200', 'dark:background-neutral-800');
				element.graph.children[index].children[0].children[0].style.height = `${packetSkeletons[index]}%`;
				fade(element.graph.children[index].children[1].children[0]);
				element.graph.children[index].children[1].children[0].classList.add('background-neutral-200', 'dark:background-neutral-800');
				element.graph.children[index].children[1].children[0].style.height = `${packetSkeletons[index]}%`;
			});
		};
		const paintPackets = (element, data) => {
			const packetRxMax = data.length === 0 ? 0 : Math.max(...data.map((statistic) => statistic.packetRx));
			const packetTxMax = data.length === 0 ? 0 : Math.max(...data.map((statistic) => statistic.packetTx));
			const packetRxSum = data.reduce((accumulator, statistic) => accumulator + statistic.packetRx, 0);
			const packetTxSum = data.reduce((accumulator, statistic) => accumulator + statistic.packetTx, 0);
			paint(element.count, ['w-40'], []);
			[`${packetRxSum} `, 'rx', ' - ', `${packetTxSum} `, 'tx'].forEach((frag, ind) => {
				element.count.children[ind].innerText = frag;
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				const step = (4 - ind) * 2;
				paint(element.scale.children[ind], [], ['h-3'], units((packetRxMax / element.scale.children.length) * step));
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				const step = (4 - ind) * 2;
				paint(element.scale.children[element.scale.children.length - 1 - ind], [], ['h-3'], units((packetTxMax / element.scale.children.length) * step));
			});
			const now = new Date();
			array(element.times.children.length).forEach((ind) => {
				const hour = new Date(now - (24 - ind) * 3600 * 1000).getHours().toString().padStart(2, '0');
				paint(element.times.children[ind].children[0], [], ['h-3', 'w-9'], `${hour}:00`);
				paint(element.times.children[ind].children[1], [], ['h-3', 'w-4'], `${hour}`);
			});
			array(element.graph.children.length).forEach((index) => {
				array(element.graph.children[index].children.length).forEach((ind) => {
					element.graph.children[index].children[ind].children[0].style.height = null;
				});
				const packetRxPercent = (data[index].packetRx / packetRxMax) * 100;
				fade(element.graph.children[index].children[0].children[0]);
				element.graph.children[index].children[0].children[0].classList.add('background-green-400/80', 'dark:background-green-600/80');
				element.graph.children[index].children[0].children[0].style.height = `${packetRxPercent}%`;
				const packetTxPercent = (data[index].packetTx / packetTxMax) * 100;
				fade(element.graph.children[index].children[1].children[0]);
				element.graph.children[index].children[1].children[0].classList.add('background-blue-400/80', 'dark:background-blue-600/80');
				element.graph.children[index].children[1].children[0].style.height = `${packetTxPercent}%`;
			});
		};
		const errorPackets = (element) => {
			error(element.count, ['w-40'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				error(element.scale.children[ind], ['h-3'], [], '');
			});
			array(Math.ceil(element.scale.children.length / 2)).forEach((ind) => {
				error(element.scale.children[element.scale.children.length - 1 - ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				error(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				error(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0].children[0]);
				element.graph.children[index].children[0].children[0].classList.add('background-red-200', 'dark:background-red-800');
				element.graph.children[index].children[0].children[0].style.height = `${packetSkeletons[index]}%`;
				fade(element.graph.children[index].children[1].children[0]);
				element.graph.children[index].children[1].children[0].classList.add('background-red-200', 'dark:background-red-800');
				element.graph.children[index].children[1].children[0].style.height = `${packetSkeletons[index]}%`;
			});
		};
		const loadingCorruptions = (element) => {
			loading(element.count, ['w-20'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(element.scale.children.length).forEach((ind) => {
				loading(element.scale.children[ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				loading(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				loading(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-neutral-200', 'dark:background-neutral-800');
				element.graph.children[index].children[0].style.height = `${corruptionSkeletons[index]}%`;
			});
		};
		const paintCorruptions = (element, data) => {
			const packetCrcMax = data.length === 0 ? 0 : Math.max(...data.map((statistic) => statistic.packetCrc));
			const packetCrcSum = data.reduce((accumulator, statistic) => accumulator + statistic.packetCrc, 0);
			paint(element.count, ['w-20'], []);
			[`${packetCrcSum} `, 'crc'].forEach((frag, ind) => {
				element.count.children[ind].innerText = frag;
			});
			array(element.scale.children.length).forEach((ind) => {
				paint(element.scale.children[ind], [], ['h-3'], units((packetCrcMax / element.scale.children.length) * (3 - ind)));
			});
			const now = new Date();
			array(element.times.children.length).forEach((ind) => {
				const hour = new Date(now - (24 - ind) * 3600 * 1000).getHours().toString().padStart(2, '0');
				paint(element.times.children[ind].children[0], [], ['h-3', 'w-9'], `${hour}:00`);
				paint(element.times.children[ind].children[1], [], ['h-3', 'w-4'], `${hour}`);
			});
			array(element.graph.children.length).forEach((index) => {
				array(element.graph.children[index].children.length).forEach((ind) => {
					element.graph.children[index].children[ind].style.height = null;
				});
				const packetCrcPercent = (data[index].packetCrc / packetCrcMax) * 100;
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-yellow-400/80', 'dark:background-yellow-600/80');
				element.graph.children[index].children[0].style.height = `${packetCrcPercent}%`;
			});
		};
		const errorCorruptions = (element) => {
			error(element.count, ['w-20'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(element.scale.children.length).forEach((ind) => {
				error(element.scale.children[ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				error(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				error(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-red-200', 'dark:background-red-800');
				element.graph.children[index].children[0].style.height = `${corruptionSkeletons[index]}%`;
			});
		};
		const loadingLosses = (element) => {
			loading(element.count, ['w-20'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(element.scale.children.length).forEach((ind) => {
				loading(element.scale.children[ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				loading(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				loading(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-neutral-200', 'dark:background-neutral-800');
				element.graph.children[index].children[0].style.height = `${lossSkeletons[index]}%`;
			});
		};
		const paintLosses = (element, data) => {
			const packetLossMax = data.length === 0 ? 0 : Math.max(...data.map((statistic) => statistic.packetLoss));
			const packetLossSum = data.reduce((accumulator, statistic) => accumulator + statistic.packetLoss, 0);
			paint(element.count, ['w-20'], []);
			[`${packetLossSum} `, 'loss'].forEach((frag, ind) => {
				element.count.children[ind].innerText = frag;
			});
			array(element.scale.children.length).forEach((ind) => {
				paint(element.scale.children[ind], [], ['h-3'], units((packetLossMax / element.scale.children.length) * (3 - ind)));
			});
			const now = new Date();
			array(element.times.children.length).forEach((ind) => {
				const hour = new Date(now - (24 - ind) * 3600 * 1000).getHours().toString().padStart(2, '0');
				paint(element.times.children[ind].children[0], [], ['h-3', 'w-9'], `${hour}:00`);
				paint(element.times.children[ind].children[1], [], ['h-3', 'w-4'], `${hour}`);
			});
			array(element.graph.children.length).forEach((index) => {
				array(element.graph.children[index].children.length).forEach((ind) => {
					element.graph.children[index].children[ind].style.height = null;
				});
				const packetLossPercent = (data[index].packetLoss / packetLossMax) * 100;
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-red-400/80', 'dark:background-red-600/80');
				element.graph.children[index].children[0].style.height = `${packetLossPercent}%`;
			});
		};
		const errorLosses = (element) => {
			error(element.count, ['w-20'], []);
			array(element.count.children.length).forEach((ind) => {
				element.count.children[ind].innerText = '';
			});
			array(element.scale.children.length).forEach((ind) => {
				error(element.scale.children[ind], ['h-3'], [], '');
			});
			array(element.times.children.length).forEach((ind) => {
				error(element.times.children[ind].children[0], ['h-3', 'w-9'], [], '');
				error(element.times.children[ind].children[1], ['h-3', 'w-4'], [], '');
			});
			array(element.graph.children.length).forEach((index) => {
				fade(element.graph.children[index].children[0]);
				element.graph.children[index].children[0].classList.add('background-red-200', 'dark:background-red-800');
				element.graph.children[index].children[0].style.height = `${lossSkeletons[index]}%`;
			});
		};
		const parseStatistics = async (response) => {
			const buffer = await response.arrayBuffer();
			const binary = new Binary(buffer);
			const statistics = [];
			while (binary.offset < buffer.byteLength) {
				const statistic = { packetRx: null, packetTx: null, packetCrc: null, packetLoss: null, packetForeign: null, airtimeRx: null, airtimeTx: null };
				statistic.packetRx = binary.uint(16);
				statistic.packetTx = binary.uint(16);
				statistic.packetCrc = binary.uint(16);
				statistic.packetLoss = binary.uint(16);
				statistic.packetForeign = binary.uint(16);
				statistic.airtimeRx = binary.uint(32);
				statistic.airtimeTx = binary.uint(32);
				statistics.push(statistic);
			}
			return statistics;
		};
		const loadStatistics = fetching(
			statistics,
			(context) => {
				window.requestAnimationFrame(() => loadingPackets(packets));
				window.requestAnimationFrame(() => loadingCorruptions(corruptions));
				window.requestAnimationFrame(() => loadingLosses(losses));
			},
			(context) => fetcher('get', '/api/statistics', null, { controller: context.controller }),
			async (context, response) => (context.data = await parseStatistics(response)),
			(context) => {
				window.requestAnimationFrame(() => paintPackets(packets, context.data));
				window.requestAnimationFrame(() => paintCorruptions(corruptions, context.data));
				window.requestAnimationFrame(() => paintLosses(losses, context.data));
			},
			(context) => {
				window.requestAnimationFrame(() => errorPackets(packets));
				window.requestAnimationFrame(() => errorCorruptions(corruptions));
				window.requestAnimationFrame(() => errorLosses(losses));
			},
		);
